version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bookscatalog-mysql
    environment:
      MYSQL_DATABASE: BooksCatalog
      MYSQL_USER: BooksCatalog
      MYSQL_PASSWORD: bookscatalog
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./doc/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data: